name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The suite is pure: it #loads the script but the entry-point guard keeps
    # collection from running, and every assertion works on fixture strings,
    # so no macOS utilities are invoked. Runs on ubuntu (1x) rather than a
    # macOS runner (10x).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet fsi MacDiskExplorer.Tests.fsx
